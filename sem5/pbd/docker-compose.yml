services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: pbd-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: koty
      APP_USER_PASSWORD: koty
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./:/pbd
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60

  postgres:
    image: postgres:17
    container_name: pbd-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: koty
      POSTGRES_PASSWORD: koty
      POSTGRES_DB: koty
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./:/pbd

volumes:
  oracle-data:
  postgres-data:
